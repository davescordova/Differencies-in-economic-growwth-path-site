<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Academic Portfolio{% endblock %} - Daves de Azevedo Cordova</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- MathJax for rendering LaTeX equations -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
</head>
<body>

    <!-- Header Section -->
    <header class="header">
        {% block header %}
            <h1>Daves de Azevedo Cordova</h1>
            <p>Academic Portfolio & Research</p>
        {% endblock %}
    </header>

    <!-- Navigation Bar -->
    <nav class="navbar">
        {% block navbar %}
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('dissertation') }}">Dissertation</a>
            <a href="{{ url_for('articles') }}">Published Articles</a>
        {% endblock %}
    </nav>

    <!-- Main Content Container -->
    <main class="container">
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Daves de Azevedo Cordova. All rights reserved.</p>
    </footer>

</body>
</html>
